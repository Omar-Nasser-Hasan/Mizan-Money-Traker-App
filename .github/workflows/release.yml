name: Release APK

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Restore signing keystore
        env:
          MIZAN_KEYSTORE_BASE64: ${{ secrets.MIZAN_KEYSTORE_BASE64 }}
        run: echo "$MIZAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mizan-release.jks"
      - name: Assemble signed release
        env:
          MIZAN_KEYSTORE_PATH: ${{ runner.temp }}/mizan-release.jks
          MIZAN_KEYSTORE_PASSWORD: ${{ secrets.MIZAN_KEYSTORE_PASSWORD }}
          MIZAN_KEY_ALIAS: ${{ secrets.MIZAN_KEY_ALIAS }}
          MIZAN_KEY_PASSWORD: ${{ secrets.MIZAN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
