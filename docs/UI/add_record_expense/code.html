<!-- Secondary Text Action -->

      Save and add another
    </button>

<script>
  // Clean financial keypad micro-interaction
  const displayAmount = document.getElementById('display-amount');
  const numberButtons = document.querySelectorAll('.keypad-key');
  const backspaceButton = document.getElementById('key-backspace');

  numberButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.getAttribute('data-val');
      if (displayAmount) {
        if (displayAmount.textContent === '0' && val !== '.') {
          displayAmount.textContent = val;
        } else if (displayAmount.textContent.length < 9) {
          if (val === '.' && displayAmount.textContent.includes('.')) return;
          displayAmount.textContent += val;
        }
      }
    });
  });

  if (backspaceButton && displayAmount) {
    backspaceButton.addEventListener('click', () => {
      if (displayAmount.textContent.length > 1) {
        displayAmount.textContent = displayAmount.textContent.slice(0, -1);
      } else {
        displayAmount.textContent = '0';
      }
    });
  }
</script></main><footer class="fixed bottom-0 w-full pointer-events-none z-50 pb-safe flex justify-center items-center h-5"><div class="w-28 h-1 bg-outline/40 rounded-full mb-1"></div></footer></body></html>
