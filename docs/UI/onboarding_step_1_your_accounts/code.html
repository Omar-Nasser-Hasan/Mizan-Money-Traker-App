<script>
  // Simple micro-interaction for balance editing affordance
  document.querySelectorAll('article').forEach((card) => {
    card.addEventListener('click', (e) => {
      const editBtn = e.target.closest('button');
      if (editBtn && editBtn.getAttribute('aria-label')) {
        const nameSpan = card.querySelector('span.font-title');
        const currentName = nameSpan.textContent;
        const newName = prompt('Rename account:', currentName);
        if (newName && newName.trim().length > 0) {
          nameSpan.textContent = newName.trim();
        }
      }
    });
  });
