<div class="h-[1px] w-full bg-outline/20"></div>

</button>

<div class="relative w-[68px] h-[68px] rounded-xl bg-surface-raised overflow-hidden flex flex-col justify-between p-2 shadow-sm cursor-pointer transition-transform active:scale-95 group">
