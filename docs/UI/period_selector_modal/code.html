<script>
  // Micro-interaction handlers for Period Selector sheet
  document.addEventListener('DOMContentLoaded', () => {
    // Quick period chip selection toggle
    const periodChips = document.querySelectorAll('[aria-label="Quick range"] button, .no-scrollbar button');
    periodChips.forEach(chip => {
      chip.addEventListener('click', function() {
        if (this.closest('.flex-col').querySelector('.font-label-caps')?.textContent.includes('QUICK RANGE')) {
          periodChips.forEach(c => {
            if (c.closest('.flex-col').querySelector('.font-label-caps')?.textContent.includes('QUICK RANGE')) {
              c.classList.remove('bg-surface-bright', 'text-accent-text', 'font-medium');
              c.classList.add('bg-surface-raised', 'text-text-dim');
              const dot = c.querySelector('.rounded-full.bg-primary-container');
              if (dot) dot.remove();
            }
          });
          this.classList.remove('bg-surface-raised', 'text-text-dim');
          this.classList.add('bg-surface-bright', 'text-accent-text', 'font-medium');
        }
      });
    });
  });
