<script>
  (function() {
    // Interactive Theme Segment Selector
    const segments = document.querySelectorAll('.appearance-segment');
    segments.forEach((seg) => {
      seg.addEventListener('click', () => {
        segments.forEach((s) => {
          s.setAttribute('aria-checked', 'false');
          s.classList.remove('bg-primary-container', 'text-on-primary', 'font-semibold');
          s.classList.add('text-text-dim');
        });
        seg.setAttribute('aria-checked', 'true');
        seg.classList.remove('text-text-dim');
        seg.classList.add('bg-primary-container', 'text-on-primary', 'font-semibold');
      });
    });

    // Interactive Toggle Switch
    const oledToggle = document.getElementById('oled-toggle');
    const oledThumb = document.getElementById('oled-thumb');
    if (oledToggle && oledThumb) {
      oledToggle.addEventListener('click', () => {
        const isChecked = oledToggle.getAttribute('aria-checked') === 'true';
        if (isChecked) {
          oledToggle.setAttribute('aria-checked', 'false');
          oledToggle.classList.remove('bg-primary-container');
          oledToggle.classList.add('bg-surface-raised');
          oledThumb.classList.remove('translate-x-5', 'bg-on-primary');
          oledThumb.classList.add('translate-x-0', 'bg-text-dim');
        } else {
          oledToggle.setAttribute('aria-checked', 'true');
          oledToggle.classList.remove('bg-surface-raised');
          oledToggle.classList.add('bg-primary-container');
          oledThumb.classList.remove('translate-x-0', 'bg-text-dim');
          oledThumb.classList.add('translate-x-5', 'bg-on-primary');
        }
      });
    }
  })();
