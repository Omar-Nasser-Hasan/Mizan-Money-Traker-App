  </head><body class="bg-black/60 font-body text-text min-h-screen flex flex-col justify-end"><div aria-label="Dismiss sheet" class="flex-1 w-full" onclick="history.back()"></div><div class="w-full h-[751px] max-h-[751px] bg-surface-raised rounded-t-[28px] flex flex-col overflow-hidden pb-safe"><div class="w-full flex flex-col items-center pt-space-md pb-space-sm flex-shrink-0 cursor-grab active:cursor-grabbing"><div class="w-9 h-1 rounded-full bg-outline/60"></div><div class="w-full px-margin pt-space-sm flex items-center justify-between"><h2 class="font-title text-title text-text">New Transaction</h2><button aria-label="Close sheet" class="w-11 h-11 -mr-2 flex items-center justify-center text-text-dim hover:text-text transition-colors rounded-full active:bg-surface-variant" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">close</span></button></div></div><main class="flex-1 flex flex-col relative w-full overflow-y-auto px-margin bg-surface-raised"><div class="flex flex-col w-full pb-6 select-none">
<!-- Interactive Form Body inside the Sheet Shell -->
<form class="flex flex-col gap-5 pt-1" id="details-form" onsubmit="event.preventDefault();">
<!-- 1. Note Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-text-dim tracking-wider uppercase" for="transaction-note">Note</label>
<div class="relative w-full rounded-xl bg-surface-raised p-3 min-h-[76px] transition-all focus-within:bg-surface-variant">
<textarea class="w-full bg-transparent text-text font-body text-body resize-none placeholder:text-text-dim/50 focus:outline-none" id="transaction-note" placeholder="Add a note" rows="2">Dinner with team after quarterly review sprint</textarea>
</div>
</div>
<!-- 2. Labels -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-text-dim tracking-wider uppercase">Labels</span>
<span class="font-body-small text-body-small text-text-dim/60">2 assigned</span>
</div>
<div class="flex flex-wrap items-center gap-2 pt-0.5">
<!-- Work Tag -->
<span class="inline-flex items-center gap-1.5 h-8 pl-3 pr-2 rounded-lg bg-surface-raised text-text font-body-small text-body-small">
<span>Work</span>
<button aria-label="Remove Work label" class="w-4 h-4 rounded-full flex items-center justify-center text-text-dim hover:text-text hover:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</span>
<!-- Shared Tag -->
<span class="inline-flex items-center gap-1.5 h-8 pl-3 pr-2 rounded-lg bg-surface-raised text-text font-body-small text-body-small">
<span>Shared</span>
<button aria-label="Remove Shared label" class="w-4 h-4 rounded-full flex items-center justify-center text-text-dim hover:text-text hover:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</span>
<!-- Add Tag Action -->
<button class="inline-flex items-center gap-1 h-8 px-2.5 rounded-lg bg-surface-raised/40 hover:bg-surface-raised text-text-dim hover:text-accent-text font-body-small text-body-small transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">add</span>

</button>
</div>
</div>

<input class="flex-1 bg-transparent text-text font-body text-body font-medium focus:outline-none placeholder:text-text-dim/40" id="payee-input" placeholder="Enter merchant or recipient" type="text" value="Cairo Kitchen"/>

</button>
</div>
<!-- Payee Quick Suggestions -->

<button class="h-7 px-3 rounded-full bg-surface-raised hover:bg-surface-variant text-text font-body-small text-body-small transition-colors whitespace-nowrap" onclick="document.getElementById('payee-input').value='Cairo Kitchen'" type="button">
          Cairo Kitchen
        </button>
<button class="h-7 px-3 rounded-full bg-surface-raised/60 hover:bg-surface-raised text-text-dim font-body-small text-body-small transition-colors whitespace-nowrap" onclick="document.getElementById('payee-input').value='Cilantro'" type="button">

<span class="material-symbols-outlined text-[16px]">credit_score</span>
<span>Credit card</span>
</button>
<!-- Bank transfer -->
<button class="h-9 px-3.5 rounded-full bg-surface-raised hover:bg-surface-variant text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center gap-1.5 transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">account_balance</span>
<span>Bank transfer</span>

<span class="material-symbols-outlined text-[16px]">smartphone</span>
<span>Mobile wallet</span>
</button>

<button class="h-9 px-3.5 rounded-full bg-surface-raised hover:bg-surface-variant text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center gap-1.5 transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">bolt</span>
<span>InstaPay</span>
</button>
<!-- Other -->
<button class="h-9 px-3.5 rounded-full bg-surface-raised hover:bg-surface-variant text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center gap-1.5 transition-colors" type="button">
<span>Other</span>
</button>
</div>
</div>

<button class="flex-1 h-full rounded-lg bg-surface text-text font-body-small text-body-small font-semibold flex items-center justify-center gap-1.5 shadow-sm transition-all" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-income"></span>
<span>Cleared</span>
</button>
<button class="flex-1 h-full rounded-lg text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center justify-center transition-colors" type="button">
<span>Uncleared</span>
</button>
<button class="flex-1 h-full rounded-lg text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center justify-center transition-colors" type="button">
<span>Reconciled</span>
</button>
</div>
</div>
<!-- 6. Date & Time Pair -->
<div class="flex flex-col gap-1.5">
<span class="font-label-caps text-label-caps text-text-dim tracking-wider uppercase">Date &amp; time</span>
<div class="grid grid-cols-2 gap-2.5">
<!-- Date Selector -->
<button class="h-12 px-3.5 rounded-xl bg-surface-raised hover:bg-surface-variant flex items-center justify-between text-left transition-colors" type="button">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-[18px] text-accent-text">calendar_today</span>
<span class="font-amount-small text-amount-small text-text tracking-tight truncate">16 Oct 2026</span>
</div>
<span class="material-symbols-outlined text-[16px] text-text-dim/60">unfold_more</span>
</button>
<!-- Time Selector -->
<button class="h-12 px-3.5 rounded-xl bg-surface-raised hover:bg-surface-variant flex items-center justify-between text-left transition-colors" type="button">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-[18px] text-accent-text">schedule</span>
<span class="font-amount-small text-amount-small text-text tracking-tight truncate">03:46 AM</span>
</div>
<span class="material-symbols-outlined text-[16px] text-text-dim/60">unfold_more</span>
</button>
</div>
</div>
<!-- 7. Receipts Section -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-text-dim tracking-wider uppercase">Receipts</span>

</div>
<div class="flex items-center gap-2.5 pt-1 overflow-x-auto">

<div class="relative w-16 h-16 rounded-xl bg-surface-raised overflow-hidden flex-shrink-0 group">

<div class="absolute inset-0 bg-surface/20"></div>

</button>

<div class="relative w-16 h-16 rounded-xl bg-surface-raised overflow-hidden flex-shrink-0 group">

<div class="absolute inset-0 bg-surface/20"></div>
<button aria-label="Remove receipt 2" class="absolute top-1 right-1 w-5 h-5 rounded-full bg-surface-raised/90 text-text hover:text-error flex items-center justify-center transition-colors" type="button">
<span class="material-symbols-outlined text-[12px]">close</span>
</button>
<div class="absolute bottom-1 left-1 px-1 rounded bg-black/60 font-label-caps text-[9px] text-text-dim">
            PNG
          </div>
</div>
<!-- Add Receipt Slot -->
<button class="w-16 h-16 rounded-xl bg-surface-raised/40 hover:bg-surface-raised text-text-dim hover:text-accent-text flex flex-col items-center justify-center gap-1 flex-shrink-0 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">add_a_photo</span>
<span class="font-label-caps text-[9px] tracking-wide">ADD</span>
</button>
</div>
</div>
<!-- Done Action Button (Primary Jewel Finish) -->
<div class="pt-3 pb-2">
<button class="w-full h-[52px] rounded-[20px] bg-primary-container active:bg-accent-text text-on-primary font-title text-body font-semibold tracking-wide flex items-center justify-center gap-2 transition-transform active:scale-[0.99]" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>Save changes</span>
</button>
</div>
</form>
</div>
<script>
  // Simple micro-interactions for segment toggling
  document.addEventListener('DOMContentLoaded', () => {
    const paymentButtons = document.querySelectorAll('#payment-methods button');
    paymentButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        paymentButtons.forEach(b => {
          b.className = 'h-9 px-3.5 rounded-full bg-surface-raised hover:bg-surface-variant text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center gap-1.5 transition-colors';
        });
        btn.className = 'h-9 px-3.5 rounded-full bg-primary-container text-on-primary font-body-small text-body-small font-semibold flex items-center gap-1.5 transition-all';
      });
    });

    const statusButtons = document.querySelectorAll('#status-segment button');
    statusButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        statusButtons.forEach(b => {
          b.className = 'flex-1 h-full rounded-lg text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center justify-center transition-colors';
        });
        btn.className = 'flex-1 h-full rounded-lg bg-surface text-text font-body-small text-body-small font-semibold flex items-center justify-center gap-1.5 shadow-sm transition-all';
      });
    });
  });
</script></main></div></body></html>
