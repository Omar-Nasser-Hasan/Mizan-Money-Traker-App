<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-surface":"#e3e2e6","light-warning":"#875A15","background":"#121316","account-azure":"#188ABB","light-transfer":"#4C6378","account-green":"#3A924F","on-secondary-fixed":"#191c1f","inverse-on-surface":"#2f3033","light-accent-text":"#77591D","tertiary-fixed":"#81f6ea","on-secondary":"#2e3034","on-tertiary":"#003733","tertiary":"#7ef3e7","secondary":"#c5c6cb","expense":"#F4806E","light-investment":"#6F4A9E","primary":"#f6de98","on-error-container":"#ffdad6","on-background":"#e3e2e6","on-error":"#690005","on-primary-fixed":"#231b00","investment":"#C0A5E8","surface-container-low":"#1a1b1e","background-oled":"#000000","light-text-dim":"#5D574C","light-surface-raised":"#EBE6DA","light-text":"#2E2B25","surface-variant":"#343538","surface-tint":"#dcc582","secondary-fixed-dim":"#c5c6cb","on-primary":"#3c2f00","account-blue":"#0785DB","warning":"#F0BD76","error-container":"#93000a","text":"#E9E6DE","on-tertiary-fixed":"#00201d","surface-container-lowest":"#0d0e11","on-surface-variant":"#cec6b5","on-primary-fixed-variant":"#55450e","accent-text":"#E6D29A","inverse-surface":"#e3e2e6","transfer":"#B5C7D8","light-outline":"#938A78","light-background":"#F5F2E9","surface-container-high":"#292a2d","account-teal":"#059093","account-orange":"#CA642F","account-pink":"#CE588B","inverse-primary":"#6e5d24","tertiary-container":"#60d6cb","light-on-primary":"#FFF8E7","surface-bright":"#38393c","text-dim":"#BEB9AF","error":"#ffb4ab","primary-fixed":"#f9e19b","on-tertiary-fixed-variant":"#00504b","light-expense":"#B03A14","outline-variant":"#4b463a","account-magenta":"#C45AAC","account-red":"#DA535F","primary-fixed-dim":"#dcc582","primary-container":"#d9c27f","account-indigo":"#717BCB","light-income":"#0C7466","surface-container":"#1e2022","income":"#58CFC4","on-primary-container":"#5f4f18","on-tertiary-container":"#005b55","account-olive":"#7A882F","on-secondary-fixed-variant":"#45474b","account-amber":"#AA7818","secondary-container":"#47494d","light-surface":"#FFFCF5","light-primary":"#8B6D2B","surface-dim":"#121316","on-secondary-container":"#b7b8bd","outline":"#5B5A54","account-violet":"#9A6EC2","secondary-fixed":"#e2e2e7","tertiary-fixed-dim":"#63d9ce","surface-container-highest":"#343538","surface":"#292A2D","surface-raised":"#34363A"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-lg":"1rem","space-xl":"1.25rem","space-xxl":"1.5rem","space-sm":"0.5rem","space-xs":"0.25rem",margin:"1.25rem","space-md":"0.75rem",gutter:"0.75rem","space-section":"2rem"},fontFamily:{"amount-medium":["Manrope"],body:["Manrope"],headline:["Manrope"],title:["Manrope"],keypad:["Manrope"],"amount-large":["Manrope"],"display-hero-mobile":["Manrope"],"amount-small":["Manrope"],"display-hero":["Manrope"],"label-caps":["Manrope"],"body-small":["Manrope"]},fontSize:{"amount-medium":["17px",{lineHeight:"20px",fontWeight:"600"}],body:["15px",{lineHeight:"22px",fontWeight:"400"}],headline:["28px",{lineHeight:"32px",fontWeight:"500"}],title:["18px",{lineHeight:"24px",fontWeight:"600"}],keypad:["30px",{lineHeight:"30px",fontWeight:"500"}],"amount-large":["28px",{lineHeight:"32px",fontWeight:"600"}],"display-hero-mobile":["36px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"500"}],"amount-small":["14px",{lineHeight:"17px",fontWeight:"600"}],"display-hero":["44px",{lineHeight:"46px",letterSpacing:"-0.02em",fontWeight:"500"}],"label-caps":["11px",{lineHeight:"14px",letterSpacing:"0.08em",fontWeight:"600"}],"body-small":["13px",{lineHeight:"18px",fontWeight:"500"}]}}}};</script><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-[#202124] text-text font-body text-body min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-[#202124]/80 backdrop-blur-xl"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Dismiss" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-text-dim hover:text-text active:bg-surface-variant/40 transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">close</span></button><h1 class="font-title text-title text-text font-semibold text-center select-none truncate px-space-sm">New Debt</h1><div class="flex items-center justify-end gap-space-sm"><button class="min-h-[44px] px-space-xs font-title text-body text-accent-text font-semibold hover:opacity-80 active:opacity-60 transition-opacity" type="button">Save</button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0 ml-1"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col flex-1 relative w-full pt-14 pb-safe bg-[#202124]"><div class="flex flex-col w-full pb-safe">
<div class="px-space-xl pt-space-md flex flex-col gap-space-xl max-w-md mx-auto w-full">
<!-- 1. Two-way Segmented Control -->
<div aria-label="Debt Direction" class="bg-surface-raised p-1 rounded-xl flex items-center justify-between" role="tablist">
<button aria-selected="true" class="flex-1 py-2.5 px-3 rounded-lg bg-surface text-text font-title text-body font-semibold flex items-center justify-center gap-2 transition-all" id="tab-lent" onclick="switchDebtType('lent')" role="tab" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-income inline-block"></span>
<span>I lent</span>
</button>
<button aria-selected="false" class="flex-1 py-2.5 px-3 rounded-lg bg-transparent text-text-dim font-title text-body font-medium flex items-center justify-center gap-2 transition-all" id="tab-borrowed" onclick="switchDebtType('borrowed')" role="tab" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-transparent inline-block"></span>
<span>I borrowed</span>
</button>
</div>
<!-- 2. Person Field & Suggestion Chips -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider px-1">Counterparty</label>
<div class="bg-surface-raised rounded-xl px-space-lg py-3 flex items-center gap-3">
<div class="w-9 h-9 rounded-full bg-surface flex items-center justify-center text-text-dim flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<div class="flex-1 flex flex-col">
<span class="font-body-small text-body-small text-text-dim leading-none">Person</span>
<input class="bg-transparent border-0 outline-none font-title text-title text-text font-semibold p-0 mt-0.5 focus:ring-0 placeholder:text-text-dim/40 w-full" id="person-input" placeholder="Name or contact" type="text" value="Essam"/>
</div>
<button aria-label="Contact picker" class="w-8 h-8 rounded-full flex items-center justify-center text-text-dim hover:text-text" type="button">
<span class="material-symbols-outlined text-[20px]">contacts</span>
</button>
</div>
<!-- Suggestion Chips -->
<div class="flex items-center gap-2 pt-1 overflow-x-auto no-scrollbar">
<button class="h-8 px-3 rounded-lg bg-surface-raised text-text font-body-small text-body-small font-medium flex items-center flex-shrink-0 active:scale-95 transition-transform" onclick="selectPerson('Essam')" type="button">
          Essam
        </button>
<button class="h-8 px-3 rounded-lg bg-surface text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center flex-shrink-0 active:scale-95 transition-transform" onclick="selectPerson('Seif')" type="button">
          Seif
        </button>
<button class="h-8 px-3 rounded-lg bg-surface text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center flex-shrink-0 active:scale-95 transition-transform" onclick="selectPerson('Nour')" type="button">
          Nour
        </button>
<button class="h-8 px-3 rounded-lg bg-surface text-text-dim hover:text-text font-body-small text-body-small font-medium flex items-center flex-shrink-0 active:scale-95 transition-transform" onclick="selectPerson('Karim')" type="button">
          Karim
        </button>
</div>
</div>
<!-- 3. Amount and Currency -->
<div class="bg-surface-raised rounded-xl p-space-lg flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider">Principal Amount</span>
<button class="flex items-center gap-1 bg-surface px-2.5 py-1 rounded-full text-text-dim hover:text-text text-body-small font-body-small" type="button">
<span class="font-semibold text-text">EGP</span>
<span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</div>
<div class="flex items-baseline gap-2 mt-1">
<span class="font-display-hero-mobile text-display-hero-mobile text-income select-none font-light" id="amount-sign">+</span>
<input class="w-full bg-transparent border-0 outline-none font-display-hero-mobile text-display-hero-mobile text-text font-semibold p-0 focus:ring-0 tracking-tight tabular-nums" inputmode="decimal" type="text" value="250.00"/>
</div>
</div>
<!-- 4. Account Used -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider px-1">Settlement Account</label>
<button class="w-full bg-surface-raised rounded-xl px-space-lg py-3.5 flex items-center justify-between text-left active:bg-surface-variant transition-colors" type="button">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-account-blue flex-shrink-0"></div>
<div class="flex flex-col">
<span class="font-title text-body font-semibold text-text">Essential</span>
<span class="font-body-small text-body-small text-text-dim tabular-nums">4,240.00 EGP available</span>
</div>
</div>
<span class="material-symbols-outlined text-text-dim text-[20px]">chevron_right</span>
</button>
</div>
<!-- 5. Date and Due Date (Side by side) -->
<div class="grid grid-cols-2 gap-space-md">
<!-- Origin Date -->
<button class="bg-surface-raised rounded-xl p-space-md flex flex-col gap-1 text-left active:bg-surface-variant transition-colors" type="button">
<span class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider flex items-center justify-between">
<span>Date</span>
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
</span>
<span class="font-title text-body font-semibold text-text mt-1">18 Feb 2026</span>
<span class="font-body-small text-body-small text-text-dim">Today</span>
</button>
<!-- Due Date -->
<button class="bg-surface-raised rounded-xl p-space-md flex flex-col gap-1 text-left active:bg-surface-variant transition-colors" type="button">
<span class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider flex items-center justify-between">
<span>Due date</span>
<span class="material-symbols-outlined text-[16px]">event_upcoming</span>
</span>
<span class="font-title text-body font-semibold text-text mt-1">18 May 2026</span>
<span class="font-body-small text-body-small text-accent-text">In 3 months</span>
</button>
</div>
<!-- 6. Note Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider px-1">Note</label>
<div class="bg-surface-raised rounded-xl px-space-lg py-3 flex items-center gap-3">
<span class="material-symbols-outlined text-text-dim text-[20px] flex-shrink-0">edit_note</span>
<input class="bg-transparent border-0 outline-none font-body text-body text-text p-0 focus:ring-0 placeholder:text-text-dim/40 w-full" placeholder="Add details or context" type="text" value="Concert tickets..."/>
</div>
</div>
<!-- 7. Educational Card -->
<div class="bg-surface-raised/70 rounded-xl p-space-md flex items-start gap-3">
<span class="material-symbols-outlined text-text-dim text-[20px] flex-shrink-0 mt-0.5">info</span>
<p class="font-body-small text-body-small text-text-dim leading-relaxed" id="educational-text">
        Lending moves cash out of the account and creates something owed to you. It isn't an expense.
      </p>
</div>
<!-- 8. Bottom CTA -->
<div class="pt-2 pb-6">
<button class="w-full h-[52px] rounded-[20px] bg-primary text-on-primary font-title text-body font-semibold flex items-center justify-center active:opacity-90 transition-opacity" type="button">
        Save debt
      </button>
</div>
</div>
</div>
<script>
  function switchDebtType(type) {
    const lentTab = document.getElementById('tab-lent');
    const borrowedTab = document.getElementById('tab-borrowed');
    const eduText = document.getElementById('educational-text');
    const amountSign = document.getElementById('amount-sign');

    if (type === 'lent') {
      lentTab.className = 'flex-1 py-2.5 px-3 rounded-lg bg-surface text-text font-title text-body font-semibold flex items-center justify-center gap-2 transition-all';
      lentTab.setAttribute('aria-selected', 'true');
      lentTab.children[0].className = 'w-1.5 h-1.5 rounded-full bg-income inline-block';

      borrowedTab.className = 'flex-1 py-2.5 px-3 rounded-lg bg-transparent text-text-dim font-title text-body font-medium flex items-center justify-center gap-2 transition-all';
      borrowedTab.setAttribute('aria-selected', 'false');
      borrowedTab.children[0].className = 'w-1.5 h-1.5 rounded-full bg-transparent inline-block';

      eduText.innerText = "Lending moves cash out of the account and creates something owed to you. It isn't an expense.";
      amountSign.innerText = '+';
      amountSign.className = 'font-display-hero-mobile text-display-hero-mobile text-income select-none font-light';
    } else {
      borrowedTab.className = 'flex-1 py-2.5 px-3 rounded-lg bg-surface text-text font-title text-body font-semibold flex items-center justify-center gap-2 transition-all';
      borrowedTab.setAttribute('aria-selected', 'true');
      borrowedTab.children[0].className = 'w-1.5 h-1.5 rounded-full bg-expense inline-block';

      lentTab.className = 'flex-1 py-2.5 px-3 rounded-lg bg-transparent text-text-dim font-title text-body font-medium flex items-center justify-center gap-2 transition-all';
      lentTab.setAttribute('aria-selected', 'false');
      lentTab.children[0].className = 'w-1.5 h-1.5 rounded-full bg-transparent inline-block';

      eduText.innerText = "Borrowing deposits funds into your account and creates a balance you owe. It isn't regular income.";
      amountSign.innerText = '−';
      amountSign.className = 'font-display-hero-mobile text-display-hero-mobile text-expense select-none font-light';
    }
  }

  function selectPerson(name) {
    const input = document.getElementById('person-input');
    input.value = name;
  }
</script></main></body></html>
