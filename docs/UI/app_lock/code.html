  </head><body class="bg-background text-on-surface font-body text-body selection:bg-primary-container selection:text-on-primary-container min-h-screen"><main class="flex flex-col relative w-full min-h-screen bg-background pt-safe pb-safe"><div class="flex flex-col w-full justify-between items-center px-margin select-none min-h-[840px] py-space-xl">
<!-- Status Bar Simulation (Handheld Ergonomics Alignment) -->
<header class="w-full flex justify-between items-center text-text-dim px-space-xs pt-space-xs">
<span class="font-label-caps text-label-caps tracking-normal font-semibold text-text">09:41</span>
<div class="flex items-center space-x-1.5 opacity-80">
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[19px] leading-none">battery_full</span>
</div>
</header>
<!-- Central Security Emblem & Typography -->
<main class="w-full flex flex-col items-center justify-center my-auto max-w-[360px]">
<!-- Crisp Champagne Scale of Justice (Mizan) 72px -->
<div aria-label="Mizan Scale Icon" class="relative flex items-center justify-center w-[72px] h-[72px] mb-space-xxl">
<svg class="text-primary-container" fill="none" height="72" viewbox="0 0 72 72" width="72" xmlns="http://www.w3.org/2000/svg">
<!-- Central Pillar & Finial -->
<circle cx="36" cy="11" r="3" stroke="#D9C27F" stroke-width="1.8"></circle>
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.8" x1="36" x2="36" y1="14" y2="60"></line>
<!-- Plinth / Base Stand -->
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.8" x1="24" x2="48" y1="60" y2="60"></line>
<!-- Crossbeam -->
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.8" x1="13" x2="59" y1="23" y2="23"></line>
<circle cx="36" cy="23" fill="#D9C27F" r="2"></circle>
<!-- Left Scale Pan & Cords -->
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.5" x1="13" x2="6" y1="23" y2="40"></line>
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.5" x1="13" x2="20" y1="23" y2="40"></line>
<path d="M5 40C5 45 21 45 21 40" stroke="#D9C27F" stroke-linecap="round" stroke-width="1.8"></path>
<!-- Right Scale Pan & Cords -->
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.5" x1="59" x2="52" y1="23" y2="40"></line>
<line stroke="#D9C27F" stroke-linecap="round" stroke-width="1.5" x1="59" x2="66" y1="23" y2="40"></line>
<path d="M51 40C51 45 67 45 67 40" stroke="#D9C27F" stroke-linecap="round" stroke-width="1.8"></path>
</svg>
</div>
<!-- Screen Title & Caption -->
<div class="text-center space-y-space-xs">
<h1 class="font-headline text-headline text-text tracking-tight font-medium">
        Mizan is locked
      </h1>
<p class="font-body-small text-body-small text-text-dim">
        Your numbers are hidden
      </p>
</div>
<!-- Primary Interaction Section (Thumb Ergonomic Zone) -->
<div class="w-full flex flex-col items-center mt-space-section space-y-space-lg">
<button aria-label="Unlock via biometrics" class="w-full h-14 bg-surface hover:bg-surface-raised active:bg-surface-variant rounded-full flex items-center justify-center space-x-space-md transition-colors duration-150 cursor-pointer" id="unlockBtn" type="button">
<span class="material-symbols-outlined text-primary-container text-[24px]">
          fingerprint
        </span>
<span class="font-title text-title font-semibold text-text">
          Unlock
        </span>
</button>
<button class="h-11 px-space-lg flex items-center justify-center font-body-small text-body-small font-medium text-accent-text hover:opacity-85 active:opacity-70 transition-opacity" id="pinBtn" type="button">
        Use device PIN
      </button>
</div>
</main>
<!-- Bottom Safe Area Caption & Android Pill -->
<footer class="w-full flex flex-col items-center space-y-space-lg pb-space-xs">
<p class="font-label-caps text-[12px] leading-4 text-text-dim/70 text-center tracking-normal">
      Locks after 30 seconds in the background
    </p>
<!-- Android Gesture Navigation Pill Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-outline/50 rounded-full"></div>
</footer>
<script>
    (function () {
      const unlockButton = document.getElementById('unlockBtn');
      const pinButton = document.getElementById('pinBtn');

      if (unlockButton) {
        unlockButton.addEventListener('click', function () {
          // Tactile response state
          unlockButton.classList.add('scale-[0.98]');
          setTimeout(() => {
            unlockButton.classList.remove('scale-[0.98]');
          }, 120);
        });
      }

      if (pinButton) {
        pinButton.addEventListener('click', function () {
          pinButton.style.opacity = '0.5';
          setTimeout(() => {
            pinButton.style.opacity = '1';
          }, 150);
        });
      }
    })();
  </script>
</div></main></body></html>
