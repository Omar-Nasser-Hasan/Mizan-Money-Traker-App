  </head><body class="bg-background font-body text-body text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary"><header class="fixed top-0 w-full z-50 pt-safe bg-background/80 backdrop-blur-xl"><div class="flex flex-col h-20"><div class="h-6 px-margin flex items-center justify-between text-body-small font-body-small text-text-dim tracking-tight select-none"><span>9:41</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[15px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[15px]">wifi</span><span class="material-symbols-outlined text-[15px]">battery_full</span></div></div><div class="flex-1 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Close" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-text hover:text-primary active:scale-95 transition-transform duration-150 focus:outline-none" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">close</span></button><h1 class="font-title text-title text-text tracking-tight truncate max-w-[200px]">Add Transaction</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-20 pb-safe bg-background"><div class="flex flex-col w-full px-margin pb-6 select-none">

        Transfer
      </button>
</div>
</div>
<!-- Dual Transfer Cards Container -->
<div class="relative flex flex-col gap-2 w-full my-space-xs">
<!-- "From" Row (Active / Focused) -->

<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider">From (Sent)</span>
<div class="flex items-center gap-1.5">
<div class="flex items-center gap-1 bg-surface-variant px-2.5 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-account-violet"></span>
<span class="font-body-small text-body-small text-text">Fun</span>
</div>
<div class="bg-surface-variant px-2 py-1 rounded-full font-label-caps text-label-caps text-transfer font-semibold">
            USD
          </div>
</div>
</div>
<div class="flex items-baseline justify-between mt-1 pb-1 relative">
<div class="flex items-baseline">
<span class="font-headline text-headline text-text-dim mr-1">$</span>
<span class="font-display-hero-mobile text-display-hero-mobile text-text tracking-tight font-medium" id="display-from">100.00</span>
</div>
<div class="flex items-center gap-1 text-text-dim">
<span class="font-body-small text-body-small">Fee-free</span>
</div>

</div>
</div>

<button class="w-9 h-9 rounded-full bg-surface-variant flex items-center justify-center text-transfer shadow-md active:scale-90 transition-transform" id="swap-accounts" type="button">
<span class="material-symbols-outlined text-[18px]">swap_vert</span>
</button>
</div>

<div class="bg-surface rounded-xl p-space-md flex flex-col gap-1">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps text-text-dim uppercase tracking-wider">To (Received)</span>
<div class="flex items-center gap-1.5">
<div class="flex items-center gap-1 bg-surface-variant px-2.5 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-account-azure"></span>
<span class="font-body-small text-body-small text-text">Essential</span>
</div>
<div class="bg-surface-variant px-2 py-1 rounded-full font-label-caps text-label-caps text-transfer font-semibold">
            EGP
          </div>
</div>
</div>
<div class="flex items-baseline justify-between mt-1 pb-1">
<div class="flex items-baseline">
<span class="font-headline text-headline text-text-dim mr-1">E£</span>
<span class="font-display-hero-mobile text-display-hero-mobile text-text-dim tracking-tight font-medium" id="display-to">4,852.00</span>
</div>
<button class="text-text-dim hover:text-text p-1 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
</div>
</div>
<!-- Exchange Rate Micro-Line -->
<div class="flex items-center justify-between px-1.5 py-1 mb-space-sm text-transfer">
<div class="flex items-center gap-1.5 font-body-small text-body-small">
<span class="material-symbols-outlined text-[14px]">sync_alt</span>
<span>1 USD = 48.52 EGP · today's rate, editable</span>
</div>
<span class="material-symbols-outlined text-[14px] text-text-dim cursor-pointer">info</span>
</div>
<!-- Metadata Action Chips (No category for transfers) -->
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 mb-space-md">
<!-- Date Chip -->
<button class="flex items-center gap-1.5 bg-surface text-text px-3 py-1.5 rounded-full shrink-0 active:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[16px] text-transfer">calendar_today</span>
<span class="font-body-small text-body-small">Today</span>
</button>
<!-- Fee Chip -->
<button class="flex items-center gap-1.5 bg-surface text-text-dim px-3 py-1.5 rounded-full shrink-0 active:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">toll</span>
<span class="font-body-small text-body-small">Fee: None</span>
</button>
<!-- Templates Chip -->
<button class="flex items-center gap-1.5 bg-surface text-text px-3 py-1.5 rounded-full shrink-0 active:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[16px] text-transfer">bookmark_border</span>
<span class="font-body-small text-body-small">Templates</span>
</button>
<!-- More Options Chip -->
<button class="flex items-center justify-center w-8 h-8 bg-surface text-text-dim rounded-full shrink-0 active:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">more_horiz</span>
</button>
</div>
<!-- Keypad Matrix (Digit Grid + Operator Column) -->
<div class="grid grid-cols-4 gap-2 mb-space-lg select-none">
<!-- Row 1 -->
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="7" type="button">7</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="8" type="button">8</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="9" type="button">9</button>
<button class="h-14 bg-surface-variant rounded-xl flex items-center justify-center font-title text-title text-text-dim active:bg-surface transition-colors" data-op="÷" type="button">÷</button>
<!-- Row 2 -->
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="4" type="button">4</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="5" type="button">5</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="6" type="button">6</button>
<button class="h-14 bg-surface-variant rounded-xl flex items-center justify-center font-title text-title text-text-dim active:bg-surface transition-colors" data-op="×" type="button">×</button>
<!-- Row 3 -->
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="1" type="button">1</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="2" type="button">2</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="3" type="button">3</button>
<button class="h-14 bg-surface-variant rounded-xl flex items-center justify-center font-title text-title text-text-dim active:bg-surface transition-colors" data-op="−" type="button">−</button>
<!-- Row 4 -->
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="." type="button">.</button>
<button class="keypad-btn h-14 bg-surface rounded-xl flex items-center justify-center font-headline text-headline text-text active:bg-surface-variant transition-colors" data-val="0" type="button">0</button>
<button class="h-14 bg-surface rounded-xl flex items-center justify-center text-text active:bg-surface-variant transition-colors" id="key-delete" type="button">
<span class="material-symbols-outlined text-[22px]">backspace</span>
</button>
<button class="h-14 bg-surface-variant rounded-xl flex items-center justify-center font-title text-title text-text-dim active:bg-surface transition-colors" data-op="+" type="button">+</button>
</div>
<!-- Action Controls -->
<div class="flex flex-col gap-3 w-full">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-[20px] font-title text-title flex items-center justify-center font-semibold active:opacity-90 transition-opacity" type="button">
      Save
    </button>
<button class="w-full py-2 text-center font-body-small text-body-small text-text-dim hover:text-text transition-colors" type="button">
      Save and add another
    </button>
</div>
</div>
<script>
  (() => {
    let currentAmount = "100.00";
    const rate = 48.52;
    const fromEl = document.getElementById("display-from");
    const toEl = document.getElementById("display-to");
    const keypadButtons = document.querySelectorAll(".keypad-btn");
    const deleteBtn = document.getElementById("key-delete");

    const updateDisplay = () => {
      fromEl.textContent = currentAmount || "0";
      const val = parseFloat(currentAmount) || 0;
      const converted = (val * rate).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
      toEl.textContent = converted;
    };

    keypadButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const val = btn.dataset.val;
        if (currentAmount === "100.00" && val !== ".") {
          currentAmount = val;
        } else if (val === ".") {
          if (!currentAmount.includes(".")) {
            currentAmount += ".";
          }
        } else {
          const parts = currentAmount.split(".");
          if (parts[1] && parts[1].length >= 2) return;
          currentAmount = currentAmount === "0" ? val : currentAmount + val;
        }
        updateDisplay();
      });
    });

    deleteBtn.addEventListener("click", () => {
      if (currentAmount.length > 1) {
        currentAmount = currentAmount.slice(0, -1);
      } else {
        currentAmount = "0";
      }
      updateDisplay();
    });

    const swapBtn = document.getElementById("swap-accounts");
    if (swapBtn) {
      swapBtn.addEventListener("click", () => {
        swapBtn.classList.toggle("rotate-180");
      });
    }
  })();
</script></main><footer class="fixed bottom-0 w-full pointer-events-none z-50 pb-safe flex justify-center items-center h-5"><div class="w-28 h-1 bg-outline/40 rounded-full mb-1"></div></footer></body></html>
